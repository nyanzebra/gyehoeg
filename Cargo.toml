[package]
name = "gyehoeg"
version = "0.1.0"
edition = "2024"

[dependencies]
dashmap = "6"
jmespatch = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
test-case = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "fs"] }
